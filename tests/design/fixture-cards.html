<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job card fixture</title>
<!-- Both job card layouts from app/src/styles.css, each with a pressable control inside. -->
<link rel="stylesheet" href="../../app/src/styles.css">
</head>
<body>
<main class="page wide jobs" id="main">
  <ul class="app-cards">
    <li class="app-card" id="grid-card">
      <button class="card-head" id="grid-head"><span class="card-employer">Bank of England</span></button>
      <button class="quiet" id="grid-inner">Change</button>
    </li>
  </ul>
  <ul class="app-cards app-list">
    <li class="app-card-item">
      <div class="app-card" id="list-card">
        <span class="app-card-employer">Civil Service Fast Stream</span>
        <button class="stage-chip" id="list-inner">Applied</button>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
