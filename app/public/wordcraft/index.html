<script type="module">

<style>
  /* Set by host-bridge.js from the first moment a hosted editor loads, and
     removed only when the build confirms embedded chrome: WordCraft's 38px
     title bar (chrome.rs:295) is pushed above the frame, so the tab strip,
     with File at its start, begins at the top edge where the parent's Back
     button covers it. */
  html.legacy-chrome #wordcraft_canvas { top: -38px; height: calc(100% + 38px); }
</style>
